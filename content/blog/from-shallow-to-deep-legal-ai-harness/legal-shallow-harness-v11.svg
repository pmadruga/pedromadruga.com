<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="830" viewBox="0 0 1040 830" role="img" aria-labelledby="title desc" font-family="Atkinson Hyperlegible Next, sans-serif"><title id="title">Shallow Legal Harness</title><desc id="desc">The legal research agent operates a chat and produces an answer. Database and uploaded documents feed the agent. Separate arrows show the agent sending an answer and the answer feeding back to the agent. No documents are generated.</desc><rect width="1040" height="830" fill="#1d1e20" /><text x="30" y="67" font-size="40" fill="#dadadb" text-anchor="start" font-weight="700">Shallow Legal Harness</text><rect x="180" y="120" width="320" height="218" rx="16" fill="#2e2e33" stroke="#8eafa7" stroke-width="2" /><text x="200" y="156" font-size="24" fill="#8eafa7" text-anchor="start" font-weight="400">1st data source</text><g transform="translate(218 197) scale(0.8)" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="252" y="205" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">Database</text><text x="200" y="252" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Legal sources and</text><text x="200" y="282" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">potentially proprietary</text><text x="200" y="312" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">content</text><rect x="540" y="120" width="320" height="218" rx="16" fill="#2e2e33" stroke="#b0a4c2" stroke-width="2" /><text x="560" y="156" font-size="24" fill="#b0a4c2" text-anchor="start" font-weight="400">2nd data source</text><g transform="translate(578 197) scale(0.8)" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="612" y="205" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">Uploaded</text><text x="560" y="241" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">documents</text><rect x="180" y="410" width="680" height="280" rx="20" fill="#292a2e" stroke="#45464a" stroke-width="1.5" /><rect x="210" y="485" width="620" height="175" rx="14" fill="#25232b" stroke="#b0a4c2" stroke-width="2" /><path d="M 340 338 V 380 H 507 V 548" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="packet"><circle r="4" fill="#8eafa7" opacity="0"><animate attributeName="opacity" values="1;1" dur="5s" repeatCount="indefinite" /><animateMotion path="M 340 338 V 380 H 507 V 548" dur="5s" begin="-0.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" /></circle></g><path d="M 700 338 V 396 H 533 V 548" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="packet"><circle r="4" fill="#b0a4c2" opacity="0"><animate attributeName="opacity" values="1;1" dur="5s" repeatCount="indefinite" /><animateMotion path="M 700 338 V 396 H 533 V 548" dur="5s" begin="-4.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" /></circle></g><text x="210" y="452" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">Legal research</text><g transform="translate(210 720) scale(0.65)" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-14" width="38" height="29" rx="6" /><path d="M 0 -14 V -22 M -19 0 H -24 M 19 0 H 24 M -7 8 H 7" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-7" cy="-3" r="2" fill="#e6b450" /><circle cx="7" cy="-3" r="2" fill="#e6b450" /></g><text x="240" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Agent</text><g transform="translate(490 720) scale(0.65)" fill="none" stroke="#c79582" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#c79582" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="520" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Data source</text><g transform="translate(810 720) scale(0.65)" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M -19 -15 H 19 V 10 H -2 L -14 20 V 10 H -19 Z" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="840" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Chat</text><text x="1010" y="802" font-size="24" fill="#9b9c9d" text-anchor="end" font-weight="400">pedromadruga.com</text><text x="230" y="518" fill="#b0a4c2" font-size="26" text-anchor="start">Chat</text><rect x="630" y="548" width="180" height="54" rx="8" fill="#352f23" stroke="#e6b450" stroke-width="1.5" /><text x="720" y="583" fill="#e6b450" font-size="26" text-anchor="middle">Answer</text><circle cx="520" cy="575" r="29" fill="#352f23" stroke="#e6b450" stroke-width="2" /><g transform="translate(520 575) scale(1)" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-14" width="38" height="29" rx="6" /><path d="M 0 -14 V -22 M -19 0 H -24 M 19 0 H 24 M -7 8 H 7" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-7" cy="-3" r="2" fill="#e6b450" /><circle cx="7" cy="-3" r="2" fill="#e6b450" /></g><text x="520" y="637" fill="#e6b450" font-size="24" text-anchor="middle">Agent</text><path d="M 548 565 H 630 M 621 560 L 630 565 L 621 570" fill="none" stroke="#e6b450" stroke-width="2" stroke-linejoin="round" /><circle r="4" fill="#e6b450" opacity="0"><animateMotion path="M 548 565 H 630" dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.9;1" calcMode="linear" /><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.89;0.9;1" dur="6s" repeatCount="indefinite" /></circle><path d="M 630 588 H 547 M 556 583 L 547 588 L 556 593" fill="none" stroke="#e6b450" stroke-width="2" stroke-linejoin="round" /><circle r="4" fill="#e6b450" opacity="0"><animateMotion path="M 630 588 H 547" dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.1;.4;1" calcMode="linear" /><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.1;.11;.39;.4;1" dur="6s" repeatCount="indefinite" /></circle></svg>