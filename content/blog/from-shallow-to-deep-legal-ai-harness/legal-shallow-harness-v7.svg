<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="830" viewBox="0 0 1040 830" role="img" aria-labelledby="title desc" font-family="Atkinson Hyperlegible Next, sans-serif"><title id="title">Legal shallow harness</title><desc id="desc">Database and uploaded documents supply the legal research agent. The agent operates a chat interface, where a user asks a question and receives the agent answer. The chat is not an independent agent. No documents are generated.</desc><rect width="1040" height="830" fill="#1d1e20" /><text x="30" y="67" font-size="40" fill="#dadadb" text-anchor="start" font-weight="700">Legal shallow harness</text><rect x="180" y="120" width="320" height="218" rx="16" fill="#2e2e33" stroke="#8eafa7" stroke-width="2" /><text x="200" y="156" font-size="24" fill="#8eafa7" text-anchor="start" font-weight="400">1st data source</text><g transform="translate(218 197) scale(0.8)" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="252" y="205" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">Database</text><text x="200" y="252" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Legal sources and</text><text x="200" y="282" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">potentially proprietary</text><text x="200" y="312" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">content</text><rect x="540" y="120" width="320" height="218" rx="16" fill="#2e2e33" stroke="#b0a4c2" stroke-width="2" /><text x="560" y="156" font-size="24" fill="#b0a4c2" text-anchor="start" font-weight="400">2nd data source</text><g transform="translate(578 197) scale(0.8)" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="612" y="205" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">Uploaded</text><text x="560" y="241" font-size="28" fill="#dadadb" text-anchor="start" font-weight="600">documents</text><rect x="180" y="410" width="680" height="280" rx="20" fill="#292a2e" stroke="#45464a" stroke-width="1.5" /><path d="M 340 338 V 365 H 337 V 508" fill="none" stroke="#8eafa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="packet"><circle r="4" fill="#8eafa7" opacity="0"><animate attributeName="opacity" values="1;1" dur="5s" repeatCount="indefinite" /><animateMotion path="M 340 338 V 365 H 337 V 508" dur="5s" begin="-0.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" /></circle></g><path d="M 700 338 V 381 H 363 V 508" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="packet"><circle r="4" fill="#b0a4c2" opacity="0"><animate attributeName="opacity" values="1;1" dur="5s" repeatCount="indefinite" /><animateMotion path="M 700 338 V 381 H 363 V 508" dur="5s" begin="-4.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" /></circle></g><text x="520.0" y="452" font-size="28" fill="#dadadb" text-anchor="middle" font-weight="600">Legal research</text><circle cx="350" cy="535" r="29" fill="#352f23" stroke="#e6b450" stroke-width="2" /><g transform="translate(350 535) scale(1)" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-14" width="38" height="29" rx="6" /><path d="M 0 -14 V -22 M -19 0 H -24 M 19 0 H 24 M -7 8 H 7" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-7" cy="-3" r="2" fill="#e6b450" /><circle cx="7" cy="-3" r="2" fill="#e6b450" /></g><g transform="translate(210 720) scale(0.65)" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-14" width="38" height="29" rx="6" /><path d="M 0 -14 V -22 M -19 0 H -24 M 19 0 H 24 M -7 8 H 7" fill="none" stroke="#e6b450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-7" cy="-3" r="2" fill="#e6b450" /><circle cx="7" cy="-3" r="2" fill="#e6b450" /></g><text x="240" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Agent</text><g transform="translate(490 720) scale(0.65)" fill="none" stroke="#c79582" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="32" rx="5" /><path d="M -12 -5 H 12 M -12 5 H 12" fill="none" stroke="#c79582" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="520" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Data source</text><g transform="translate(810 720) scale(0.65)" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M -19 -15 H 19 V 10 H -2 L -14 20 V 10 H -19 Z" fill="none" stroke="#b0a4c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="840" y="729" font-size="24" fill="#dadadb" text-anchor="start" font-weight="400">Chat</text><text x="1010" y="802" font-size="24" fill="#9b9c9d" text-anchor="end" font-weight="400">pedromadruga.com</text><text x="311" y="592" fill="#e6b450" font-size="24">Agent</text><path d="M 379 535 H 550 M 540 530 L 550 535 L 540 540" fill="none" stroke="#e6b450" stroke-width="2" stroke-linejoin="round" /><text x="405" y="521" fill="#9b9c9d" font-size="24">Runs</text><g aria-label="Chat operated by the legal research agent, containing a user question and the agent answer"><rect x="550" y="480" width="270" height="186" rx="14" fill="#25232b" stroke="#b0a4c2" stroke-width="2" /><text x="572" y="515" fill="#b0a4c2" font-size="26">Chat</text><rect x="612" y="533" width="188" height="46" rx="10" fill="#3a3445" /><text x="634" y="564" fill="#dadadb" font-size="25">Question</text><rect x="570" y="596" width="188" height="46" rx="10" fill="#352f23" /><text x="592" y="627" fill="#e6b450" font-size="25">Answer</text></g><g aria-label="Agent operates the chat"><circle r="4" fill="#e6b450" opacity="0"><animateMotion path="M 379 535 H 550" dur="4s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" repeatCount="indefinite" /></circle></g></svg>