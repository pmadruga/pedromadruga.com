[build]
  publish = "public"
  command = "hugo --gc --minify"

# NODE_VERSION: the build image defaults to an ancient Node (12.x), which
# breaks Netlify extensions (e.g. prerender pulls in puppeteer, Node >= 18).
[build.environment]
  NODE_VERSION = "20"
  HUGO_VERSION = "0.164.0"

[context.production.environment]
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL --buildFuture"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL --buildFuture"

[dev]
command = "hugo -b http://127.0.0.1:8888/ -w --buildDrafts -F "
framework = "#static"
publish = "./public/"

# Security headers + sensible default cache for all responses.
# The script-src sha256 hash covers PaperMod's inline theme-detection
# snippet (runs before paint to avoid a flash of the wrong theme). If the
# PaperMod theme is updated, rebuild with --minify and recompute the hash,
# otherwise the strict CSP will block that inline script.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BpEdBCM/4BJbN8LWEqCQKlp9VGzetdD0UbdMayNyD28='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; form-action 'self' https://buttondown.email; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted (content-hashed) assets — safe to cache permanently.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
