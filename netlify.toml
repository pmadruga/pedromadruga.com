[build]
  publish = "public"
  command = "hugo --gc --minify"

# NODE_VERSION: the build image defaults to an ancient Node (12.x), which
# breaks Netlify extensions (e.g. prerender pulls in puppeteer, Node >= 18)
# and trips the Agent Runners "Node 22+" warning. Keep in sync with .nvmrc,
# which is what Agent Runners / dependency detection actually read.
[build.environment]
  NODE_VERSION = "22"
  # Netlify auto-runs `bun install` because bun.lock is committed; pin the
  # Bun version (otherwise it silently tracks the build image's default).
  BUN_VERSION = "1.3.14" # keep in sync with scripts/setup.sh and lint.yml
  HUGO_VERSION = "0.164.0"

[context.production.environment]
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL --buildFuture"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL --buildFuture"

[dev]
command = "hugo -b http://127.0.0.1:8888/ -w --buildDrafts -F "
framework = "#static"
publish = "./public/"

# Security headers + sensible default cache for all responses.
# img-src has no data: (nothing on the site uses data URIs); frame-ancestors
# 'none' + X-Frame-Options DENY because nothing embeds these pages;
# autoplay=(self) in Permissions-Policy keeps the self-hosted <video> working.
# The script-src sha256 hash covers PaperMod's inline theme-detection
# snippet (runs before paint to avoid a flash of the wrong theme). If the
# PaperMod theme is updated, rebuild with --minify and recompute the hash,
# otherwise the strict CSP will block that inline script.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BpEdBCM/4BJbN8LWEqCQKlp9VGzetdD0UbdMayNyD28='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://cdn.bsky.app; connect-src 'self'; form-action 'self' https://buttondown.com https://buttondown.email; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted (content-hashed) assets — safe to cache permanently.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts never change once shipped.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Processed global resources (profile photo etc.) publish under /images/
# with content-hashed (_hu_) filenames — safe to cache permanently.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Blog post page-bundle media. Content-hashed image variants are safe to
# cache forever. The mp4/poster/source originals are NOT hashed, so any
# replaced media file must get a NEW filename (rename-on-change convention).
[[headers]]
  for = "/blog/:slug/:file"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pagination pages (/blog/page/2/ etc.) would otherwise match the
# :slug/:file rule above and get cached immutable — keep them fresh.
# Same-header rules are last-match-wins, so this must come after it.
[[headers]]
  for = "/blog/page/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The explicit /blog/<slug>/index.html URL also matches :slug/:file — a
# page pinned immutable for a year would keep serving a stale CSP-hashed
# inline script after a theme update.
[[headers]]
  for = "/blog/:slug/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The about page bundle (photo + its _hu_ WebP variants) — same rules as
# blog media: variants are hashed, about.jpg follows rename-on-change.
[[headers]]
  for = "/about/:file"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/about/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Favicons and the manifest are unhashed: a day, not immutable.
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/android-chrome-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify has no MIME mapping for .webmanifest and serves it as
# application/octet-stream, which nosniff makes browsers distrust.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Keep the stable CV URL pointing at the current dated PDF.
[[redirects]]
  from = "/cv.pdf"
  to = "/cv-october-2026.pdf"
  status = 302

# /search/ was removed — send old links to the post archive.
[[redirects]]
  from = "/search/"
  to = "/blog/"
  status = 301

# Posts moved from /posts/<slug>/ to /blog/<slug>/ — preserve old
# permalinks and backlinks.
[[redirects]]
  from = "/posts/*"
  to = "/blog/:splat"
  status = 301

# The about photo moved into the page bundle; the video was re-encoded
# under a new name (rename-on-change). Keep old public URLs alive for
# external links, RSS readers, and newsletter archives.
[[redirects]]
  from = "/about.jpg"
  to = "/about/about.jpg"
  status = 301

[[redirects]]
  from = "/blog/domain-driven-ai/domain-driven-ai.mp4"
  to = "/blog/domain-driven-ai/domain-driven-ai-720.mp4"
  status = 301
