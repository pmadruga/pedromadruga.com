{{- /* JSON-LD structured data for website/homepage. No `jsonify`: inside a
<script> Hugo's html/template already JSON-encodes each value (adding it
double-encoded every string, e.g. "name":"\"Pedro Madruga\""). */ -}}
{{- if .IsHome -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title }},
  "description": {{ .Site.Params.description }},
  "url": {{ .Site.BaseURL }},
  {{- /* same @id as the Person block in templates/schema_json.html, so the
  WebSite's author resolves to that fully described entity */}}
  "author": {
    "@type": "{{ (site.Params.schema.publisherType | default "Organization") | title }}",
    "@id": {{ printf "%s#%s" site.Home.Permalink (lower (site.Params.schema.publisherType | default "Organization")) }},
    "name": {{ .Site.Title }}
  }
}
</script>
{{- end -}}
