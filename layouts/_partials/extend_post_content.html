{{- /* Newsletter subscribe form at the end of every blog post.
Scoped to type "blog" so regular pages (about, cv, newsletter) are
unaffected. */ -}}
{{- if eq .Type "blog" }}
<div class="newsletter-top post-newsletter">
  <p class="post-newsletter-text">Subscribe to my <a class="description-link" href="/newsletter/">newsletter</a> and get these posts in your inbox.</p>
  {{- partial "newsletter_form.html" . }}
</div>
{{- end }}
