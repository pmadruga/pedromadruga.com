# Weekly external link check (used by .github/workflows/link-check.yml).
DirectoryPath: 'public'
CheckExternal: true
CheckInternal: true
CheckInternalHash: true
CheckImages: true
CheckScripts: true
IgnoreAltEmpty: true # decorative images carry alt="" (see .htmltest.yml)
ExternalTimeout: 30
# /notes/ is the build-time Bluesky feed: its outbound links are whatever
# the posts (and their link-card embeds) contain, and they cannot be fixed
# in this repo. Internal links on that page are still covered by the
# per-push CI (.htmltest.yml).
IgnoreDirs:
  - '^notes/'
IgnoreURLs:
  # Bot-hostile hosts that rate-limit or block link checkers. Entries are
  # regexes matched anywhere in the URL (so subdomains like uk.linkedin.com
  # are covered too).
  - 'linkedin\.com'
  - 'https://x.com'
  - 'https://twitter.com'
  # doi.org returns 202/403 to non-browser agents
  - 'doi\.org'
  # medium.com 403s link checkers
  - 'medium\.com'
  # jobindex.dk intermittently 503s bots
  - 'jobindex\.dk'
