pre-commit:
  parallel: true
  commands:
    # node_modules/.bin, not bunx: it always exists when the hooks do (the
    # `prepare` script installs both) and runs the lockfile's version, with
    # no dependency on bunx being on PATH (scripts/setup.sh installs only
    # the bun binary) or on the network.
    lint-markdown:
      glob: '*.md'
      run: node_modules/.bin/markdownlint-cli2 {staged_files}
    check-formatting:
      glob: '*.{json,yaml,yml}'
      run: node_modules/.bin/prettier --check {staged_files}

pre-push:
  commands:
    hugo-build:
      # Cheapest guard against template breakage; skipped if hugo missing.
      run: sh -c 'command -v hugo >/dev/null && hugo --quiet --renderToMemory || echo "hugo not installed, skipping build check"'
