name: Link Check

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  HTMLTEST_VERSION: '0.17.0' # keep in sync with lint.yml and scripts/setup.sh

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build Site
        run: hugo --minify --buildDrafts=false

      - name: Setup htmltest
        uses: ./.github/actions/setup-htmltest
        with:
          version: ${{ env.HTMLTEST_VERSION }}

      - name: Check External Links
        run: htmltest --conf .htmltest.external.yml
