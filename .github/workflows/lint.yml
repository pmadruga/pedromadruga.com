name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'content/**'
      - '*.md' # README/CLAUDE.md are linted by `bun run lint` too
      - 'docs/**'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'themes/**'
      - 'hugo.yaml'
      - 'netlify.toml'
      - 'package.json'
      - 'bun.lock'
      - '.htmltest.yml'
      - '.markdownlint-cli2.yaml'
      - '.prettierrc'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HTMLTEST_VERSION: '0.17.0' # keep in sync with link-check.yml and scripts/setup.sh

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3' # keep in sync with netlify.toml and scripts/setup.sh

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Markdown Lint
        run: bun run lint

      - name: Formatting Check
        run: bun run format:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.168.0'
          extended: true

      # HUGO_CACHEDIR pins the cache to the path below; Hugo's default on the
      # runner is ~/.cache/hugo_cache, which this step would never restore.
      - name: Cache Hugo Resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/
            /tmp/hugo_cache/
          key: hugo-${{ github.ref_name }}-${{ hashFiles('hugo.yaml', 'content/**', 'layouts/**', 'assets/**') }}
          restore-keys: |
            hugo-${{ github.ref_name }}-

      - name: Build Site
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
        run: hugo --minify --buildDrafts=false

      - name: Setup htmltest
        uses: ./.github/actions/setup-htmltest
        with:
          version: ${{ env.HTMLTEST_VERSION }}

      - name: HTML Validation
        # No path arg: htmltest only honours .htmltest.yml when invoked
        # without one (DirectoryPath/CheckExternal/IgnoreURLs come from there).
        run: htmltest
