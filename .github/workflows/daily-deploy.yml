name: Daily build and deploy

# Starts a Netlify production build once a day so the /notes/ Bluesky feed
# (fetched at build time, no client JS) stays fresh between pushes. Netlify
# builds the site itself (netlify.toml → scripts/netlify-build.sh), which
# requires a non-empty feed on hook-triggered builds; a failed build keeps
# the previous deploy live. Requires one repo secret:
#   NETLIFY_BUILD_HOOK_URL — Site configuration → Build & deploy →
#                            Continuous deployment → Build hooks. The URL
#                            can only start builds of this site, unlike the
#                            account-wide personal access token this job
#                            used to deploy with.

on:
  schedule:
    - cron: '23 5 * * *' # daily at 05:23 UTC (off-peak, avoids top-of-hour load)
  workflow_dispatch: # manual trigger for testing

permissions: {}

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL secret is not set"
            exit 1
          fi
          # trigger_title labels the build in Netlify's deploy list and is
          # what scripts/netlify-build.sh sees as INCOMING_HOOK_TITLE
          curl -fsS -X POST -d '' "${HOOK_URL}?trigger_title=Daily+notes+feed+refresh"
