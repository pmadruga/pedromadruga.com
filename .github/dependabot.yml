version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - '*'
  # pinned deploy CLI used by daily-deploy.yml
  - package-ecosystem: 'bun'
    directory: '/.github/netlify-cli'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
  - package-ecosystem: 'gitsubmodule'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
