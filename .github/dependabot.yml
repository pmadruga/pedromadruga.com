version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
  # composite actions are not covered by the '/' entry above
  - package-ecosystem: 'github-actions'
    directory: '/.github/actions/setup-htmltest'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
  - package-ecosystem: 'gitsubmodule'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
