baseURL: https://pedromadruga.com/
locale: en-us
title: Pedro Madruga
theme: 'PaperMod'

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# Image processing configuration for optimization
imaging:
  resampleFilter: 'Lanczos'
  quality: 85
  anchor: 'Smart'
  bgColor: '#ffffff'
  hint: 'photo'

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Pedro Madruga
  description: 'Pedro Madruga - personal website and AI-related blog.'
  keywords: [Blog, Data Science, Machine Learning, Artificial Intelligence]
  author: Pedro Madruga
  # images: ["<link or path of image for opengraph, twitter-cards>"]

  DateFormat: 'January 2, 2006'
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  mainSections:
    - blog

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  # comments: true
  hidemeta: false
  hideSummary: true
  showtoc: true
  tocopen: false
  ShowFullTextinRSS: true

  # assets:
  #   # disableHLJS: true # to disable highlight.js
  #   # disableFingerprinting: true
  #   favicon: "<link / abs url>"
  #   favicon16x16: "<link / abs url>"
  #   favicon32x32: "<link / abs url>"
  #   apple_touch_icon: "<link / abs url>"
  #   safari_pinned_tab: "<link / abs url>"

  # label:
  #   text: "Home"
  #   icon: /apple-touch-icon.png
  #   iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: "Hello world, \n\n I'm Pedro."
    subtitle: 'AI Scientist living in Denmark.'
    imageUrl: 'images/profile5.jpeg'
    imageWidth: 250
    imageHeight: 250
    imageTitle: 'Portrait of Pedro Madruga'

  socialIcons:
    - name: bluesky
      url: https://bsky.app/profile/pedromadruga.com
    # - name: newsletter
    #   url: https://pedromadruga.com/newsletter
    - name: mastodon
      url: 'https://sigmoid.social/@pmadruga'
    # - name: medium
    #  url: "https://medium.com/@pmadruga"
    - name: github
      url: 'https://github.com/pmadruga'
    # - name: stackoverflow
    #   url: "https://stackoverflow.com/users/12418383"
    - name: linkedin
      url: 'https://www.linkedin.com/in/pedromadruga'
    - name: rss
      url: 'https://pedromadruga.com/blog/index.xml'

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page
    responsiveImages: true

  # editPost disabled — uncomment to show a "Suggest Changes" link on posts
  # editPost:
  #   URL: 'https://github.com/pmadruga/pedromadruga.com/tree/master/content'
  #   Text: 'Suggest Changes' # edit text
  #   appendFilePath: false # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ['title', 'permalink', 'summary', 'content']
menu:
  main:
    - identifier: blog
      name: blog
      url: /blog/
      weight: 20
    - identifier: newsletter
      name: newsletter
      url: /newsletter/
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 40
    # cv temporarily disabled
    # - identifier: cv
    #   name: cv
    #   url: /cv/
    #   weight: 40
    - identifier: search
      name: search
      url: /search/
      weight: 45
    - identifier: contact
      name: contact
      url: /contact/
      weight: 50

#    - identifier: about
#      name: about
#      url: /about/
#      weight: 30
#    - identifier: projects
#      name: projects
#      url: /projects/
#      weight: 20
#    - identifier: newsletter
#      name: newsletter
#      url: /newsletter/
#      weight: 20
# - identifier: experiment
#   name: experiment
#   url: /experiment/
#   weight: 20
# - identifier: example
#   name: example.org
#   url: https://example.org
#   weight: 30

markup:
  highlight:
    # Class-based highlighting (theme ships chroma-styles.css) instead of
    # inline style attributes on every code element.
    noClasses: false

services:
  rss:
    limit: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary
