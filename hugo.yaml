baseURL: https://pedromadruga.com/
locale: en-US # language_TERRITORY: feeds og:locale (en_US) and the RSS <language>
title: Pedro Madruga
theme: 'PaperMod'

enableRobotsTXT: true
buildDrafts: false
buildFuture: true # future-dated posts publish as soon as they are pushed; the date is display-only
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# Image processing configuration for optimization
imaging:
  resampleFilter: 'Lanczos'
  anchor: 'Smart'
  bgColor: '#ffffff'
  # per-format keys: the global quality/hint keys were deprecated in Hugo 0.163
  jpeg:
    quality: 85
  webp:
    # q80 keeps screenshots crisp and is 20-30% smaller than q85 on the
    # photo covers. The render-image hook, cover.html and the profile image
    # all omit an explicit q so this is the single place to tune it.
    quality: 80
    hint: 'photo'

# Hugo's default lastmod chain starts with :git (the file's last commit), so
# every housekeeping commit (alt text, lint fixes, renames) marked old posts
# "modified today" in the sitemap, article:modified_time and the JSON-LD
# dateModified. Drop :git; a post that is substantively revised gets an
# explicit `lastmod:` in its front matter, otherwise lastmod = date.
frontmatter:
  lastmod: ['lastmod', 'date', 'publishDate']

# No post uses tags or categories, so the empty /tags/ and /categories/
# pages (and their feeds) were thin, indexable, and in the sitemap.
disableKinds: ['taxonomy', 'term']

# Only layouts/notes.html fetches at build time (Bluesky feed); anything
# else reaching for resources.GetRemote fails the build instead of fetching.
security:
  http:
    urls: ['^https://public\.api\.bsky\.app/']
    methods: ['(?i)GET']

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Pedro Madruga
  description: 'AI engineer and leader based in Copenhagen. I build AI products, lead engineering teams, and write about applied AI and legal technology.'
  keywords:
    [
      Blog,
      Data Science,
      Machine Learning,
      Artificial Intelligence,
      Generative AI,
      Deep Learning,
      AI Engineering,
      AI Leadership,
      AI Product Management,
      AI Team Management,
      AI Strategy,
      AI Ethics,
      AI Research,
      AI Development,
      AI Deployment,
      AI Trends,
      AI Applications,
      AI Tools,
      AI Frameworks,
    ]
  author: Pedro Madruga
  # Personal site: the JSON-LD entity is a Person (theme default is
  # Organization). sameAs lists profile URLs only — socialIcons (the theme's
  # fallback) also contains the newsletter and RSS links, which aren't profiles.
  schema:
    publisherType: Person
    sameAs:
      - https://bsky.app/profile/pedromadruga.com
      - https://sigmoid.social/@pmadruga
      - https://github.com/pmadruga
      - https://www.linkedin.com/in/pedromadruga
  images: ['/images/og-default.png'] # default opengraph/twitter card (pages with a cover use that instead)

  DateFormat: 'January 2, 2006'
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  mainSections:
    - blog

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true # prev/next under each post: the only post-to-post links besides the archives
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  # comments: true
  hidemeta: false
  hideSummary: true
  showtoc: true
  tocopen: false
  ShowFullTextinRSS: true

  assets:
    # Favicon <link> tags are hardcoded in the head.html override; this param
    # only feeds the JSON-LD schema logo/image (templates/schema_json.html)
    favicon: 'android-chrome-512x512.png'
    # # disableHLJS: true # to disable highlight.js
    # # disableFingerprinting: true
    # favicon16x16: "<link / abs url>"
    # favicon32x32: "<link / abs url>"
    # apple_touch_icon: "<link / abs url>"
    # safari_pinned_tab: "<link / abs url>"

  # label:
  #   text: "Home"
  #   icon: /apple-touch-icon.png
  #   iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    # markdown hard break (two trailing spaces), not a paragraph break:
    # a second paragraph would render invalid <p> elements inside the <h1>
    title: "Hey there,  \nI'm Pedro."
    subtitle: 'I lead AI teams and ship AI products. And I [write about it](/blog/).'
    imageUrl: 'images/profile7.png'
    imageWidth: 250
    imageHeight: 250
    imageTitle: 'Portrait of Pedro Madruga'

  socialIcons:
    - name: bluesky
      url: https://bsky.app/profile/pedromadruga.com
    # the theme has no "newsletter" icon; email envelope stands in for it
    - name: email
      url: /newsletter/
    - name: mastodon
      url: 'https://sigmoid.social/@pmadruga'
    # - name: medium
    #  url: "https://medium.com/@pmadruga"
    - name: github
      url: 'https://github.com/pmadruga'
    # - name: stackoverflow
    #   url: "https://stackoverflow.com/users/12418383"
    - name: linkedin
      url: 'https://www.linkedin.com/in/pedromadruga'
    - name: rss
      url: /blog/index.xml

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"

  footer:
    text: 'No cookies used.'

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page
    responsiveImages: true

  # editPost disabled — uncomment to show a "Suggest Changes" link on posts
  # editPost:
  #   URL: 'https://github.com/pmadruga/pedromadruga.com/tree/master/content'
  #   Text: 'Suggest Changes' # edit text
  #   appendFilePath: false # to append file path to Edit link

menu:
  main:
    - identifier: blog
      name: blog
      url: /blog/
      weight: 20
    - identifier: about
      name: about
      url: /about/
      weight: 40
    # cv temporarily disabled
    # - identifier: cv
    #   name: cv
    #   url: /cv/
    #   weight: 40
    - identifier: notes
      name: notes
      url: /notes/
      weight: 25
    - identifier: newsletter
      name: newsletter
      url: /newsletter/
      weight: 30
    - identifier: contact
      name: contact
      url: /contact/
      weight: 50

#    - identifier: about
#      name: about
#      url: /about/
#      weight: 30
#    - identifier: projects
#      name: projects
#      url: /projects/
#      weight: 20
#    - identifier: newsletter
#      name: newsletter
#      url: /newsletter/
#      weight: 20
# - identifier: experiment
#   name: experiment
#   url: /experiment/
#   weight: 20
# - identifier: example
#   name: example.org
#   url: https://example.org
#   weight: 30

markup:
  highlight:
    # Class-based highlighting (theme ships chroma-styles.css) instead of
    # inline style attributes on every code element.
    noClasses: false

services:
  rss:
    limit: 20

outputs:
  home:
    - HTML
    - RSS

# The /notes/ page fetches the Bluesky feed at build time
# (resources.GetRemote in layouts/notes.html); cap the remote cache so
# every deploy picks up fresh posts.
caches:
  getresource:
    maxAge: 10m
